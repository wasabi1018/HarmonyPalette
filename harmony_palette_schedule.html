<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#ef668f">

<title>Harmony Palette｜グリーティングスケジュール</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
:root {
  --pink: #ef668f;
  --pink-dark: #dc5079;
  --pink-light: #fff0f5;
  --orange: #f5a55c;
  --yellow: #f3c96e;
  --green: #79c898;
  --mint: #72c9bd;
  --blue: #77b9df;
  --purple: #b795d4;
  --brown: #5b4943;
  --text: #554846;
  --muted: #8d7b78;
  --line: #f0dce3;
  --paper: #ffffff;
  --shadow: 0 10px 28px rgba(139, 83, 96, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  color: var(--text);

  font-family:
    "Yu Gothic",
    "Hiragino Maru Gothic ProN",
    "Noto Sans JP",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 5%,
      rgba(239, 102, 143, 0.1),
      transparent 24rem
    ),
    radial-gradient(
      circle at 92% 8%,
      rgba(114, 201, 189, 0.12),
      transparent 25rem
    ),
    linear-gradient(180deg, #ffffff, #fff8fb);
}

body.modal-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid rgba(239, 102, 143, 0.3);
  outline-offset: 2px;
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 14px 50px;
}

header,
.filters,
.day {
  border: 1px solid var(--line);
  background: var(--paper);
  box-shadow: var(--shadow);
}

/* ヘッダー */

header {
  position: relative;
  overflow: hidden;
  padding: 24px;
  border-radius: 26px;
  text-align: center;
}

header::before,
header::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  opacity: 0.18;
  pointer-events: none;
}

header::before {
  top: -100px;
  right: -70px;
  width: 190px;
  height: 190px;
  background: #ffc5d6;
}

header::after {
  bottom: -90px;
  left: -60px;
  width: 150px;
  height: 150px;
  background: #bfeade;
}

.logo {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.bow {
  position: relative;
  width: 74px;
  height: 54px;
  flex-shrink: 0;
}

.bow-left,
.bow-right {
  position: absolute;
  top: 8px;
  width: 36px;
  height: 36px;
  background: linear-gradient(145deg, #f984a5, #e8507c);
}

.bow-left {
  left: 1px;
  border-radius: 60% 38% 50% 60%;
  transform: rotate(-14deg);
}

.bow-right {
  right: 1px;
  border-radius: 38% 60% 60% 50%;
  transform: rotate(14deg);
}

.bow-center {
  position: absolute;
  z-index: 2;
  top: 12px;
  left: 50%;
  width: 30px;
  height: 30px;
  border: 4px solid #ffffff;
  border-radius: 50%;
  background: #f26791;
  transform: translateX(-50%);
}

h1 {
  margin: 0;
  color: var(--brown);
  font-family: Georgia, "Yu Mincho", serif;
  font-size: clamp(30px, 6vw, 54px);
  line-height: 1.15;
}

.palette span:nth-child(1) {
  color: var(--pink);
}

.palette span:nth-child(2) {
  color: var(--orange);
}

.palette span:nth-child(3) {
  color: var(--yellow);
}

.palette span:nth-child(4) {
  color: var(--green);
}

.palette span:nth-child(5) {
  color: var(--mint);
}

.palette span:nth-child(6) {
  color: var(--blue);
}

.palette span:nth-child(7) {
  color: var(--purple);
}

header p {
  position: relative;
  z-index: 1;
  margin: 9px 0 0;
  color: #75615d;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.header-description {
  position: relative;
  z-index: 1;
  margin-top: 12px;
  color: var(--muted);
  font-size: 13px;
}

/* 検索エリア */

.filters {
  margin-top: 18px;
  padding: 17px;
  border-radius: 24px;
}

.filter-grid {
  display: grid;
  grid-template-columns:
    minmax(260px, 1.5fr)
    minmax(160px, 1fr)
    minmax(150px, 1fr)
    minmax(150px, 1fr);
  gap: 11px;
}

.field {
  min-width: 0;
}

.field-label {
  display: block;
  margin: 0 0 6px 3px;
  color: #8c6f76;
  font-size: 12px;
  font-weight: 800;
}

select,
input[type="date"] {
  width: 100%;
  min-height: 45px;
  padding: 11px;
  border: 1px solid #ead6dd;
  border-radius: 13px;
  outline: none;
  background: #fffafd;
  color: var(--text);
}

select:focus,
input[type="date"]:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 4px rgba(239, 102, 143, 0.12);
}

/* キャラクター選択 */

.character-field {
  position: relative;
  min-width: 0;
}

.character-toggle {
  position: relative;
  display: block;
  width: 100%;
  min-height: 45px;
  padding: 11px 38px 11px 13px;
  overflow: hidden;
  border: 1px solid #ead6dd;
  border-radius: 13px;
  background: #fffafd;
  color: var(--text);
  text-align: left;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.character-toggle::after {
  content: "▼";
  position: absolute;
  top: 50%;
  right: 13px;
  color: #a17c87;
  font-size: 11px;
  transform: translateY(-50%);
}

.character-toggle[aria-expanded="true"] {
  border-color: var(--pink);
  box-shadow: 0 0 0 4px rgba(239, 102, 143, 0.12);
}

.character-toggle[aria-expanded="true"]::after {
  content: "▲";
}

.character-backdrop {
  position: fixed;
  z-index: 9998;
  inset: 0;
  display: none;
  background: rgba(65, 45, 52, 0.46);
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}

.character-backdrop.open {
  display: block;
}

.character-popover {
  position: absolute;
  z-index: 9999;
  top: calc(100% + 7px);
  left: 0;
  display: none;
  width: min(470px, calc(100vw - 40px));
  max-height: 440px;
  overflow: hidden;
  border: 1px solid #ead6dd;
  border-radius: 18px;
  background: #ffffff;
  box-shadow: 0 18px 45px rgba(106, 65, 78, 0.22);
}

.character-popover.open {
  display: flex;
  flex-direction: column;
}

.character-popover-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  padding: 14px 15px;
  border-bottom: 1px solid #f1e1e6;
  background: #ffffff;
}

.character-popover-title {
  margin: 0;
  color: #6f585f;
  font-size: 15px;
  font-weight: 900;
}

.character-close {
  display: grid;
  place-content: center;
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: #f8edf1;
  color: #805d68;
  font-size: 24px;
  line-height: 1;
}

.character-tools {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  padding: 11px 14px;
  border-bottom: 1px solid #f1e1e6;
  background: #fffafb;
}

.character-tools button {
  flex: 1;
  min-height: 41px;
  padding: 8px;
  border: 0;
  border-radius: 11px;
  background: #f8edf1;
  color: #805d68;
  font-size: 12px;
  font-weight: 800;
}

.character-scroll {
  min-height: 0;
  padding: 12px 14px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.character-choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.character-check {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: 45px;
  padding: 9px 10px;
  border: 1px solid #f0dfe5;
  border-radius: 12px;
  background: #fffafd;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  -webkit-tap-highlight-color: transparent;
}

.character-check.selected-option {
  border-color: var(--pink);
  background: var(--pink-light);
  color: var(--pink-dark);
}

.character-check input {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  margin: 0;
  accent-color: var(--pink);
}

.character-check span {
  min-width: 0;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.character-popover-footer {
  display: none;
}

/* 検索方法 */

.match-mode {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px dashed #ead6dd;
}

.match-mode-label {
  width: 100%;
  color: #8c6f76;
  font-size: 12px;
  font-weight: 800;
}

.match-radio {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border: 1px solid #ead6dd;
  border-radius: 999px;
  background: #fffafd;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
}

.match-radio input {
  accent-color: var(--pink);
}

/* 操作ボタン */

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 13px;
}

.chips,
.action-buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.chip,
.reset,
.export-button {
  min-height: 40px;
  padding: 8px 12px;
  border: 0;
  border-radius: 999px;
  font-weight: 800;
}

.chip {
  border: 1px solid #ead6dd;
  background: #ffffff;
  color: var(--text);
}

.chip.on {
  border-color: var(--pink);
  background: var(--pink);
  color: #ffffff;
}

.reset {
  background: #f8edf1;
  color: #805d68;
}

.export-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: linear-gradient(135deg, #ef668f, #f487a6);
  color: #ffffff;
  box-shadow: 0 6px 14px rgba(239, 102, 143, 0.23);
}

.export-button:disabled {
  cursor: wait;
  opacity: 0.7;
}

.information {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 13px;
}

.information span {
  padding: 6px 9px;
  border: 1px solid #f0dfe5;
  border-radius: 999px;
  background: #ffffff;
  color: var(--muted);
  font-size: 11px;
}

/* 検索結果 */

.summary {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  margin: 24px 3px 10px;
}

.summary h2 {
  margin: 0;
  font-size: 23px;
}

.summary small {
  color: var(--muted);
}

.count {
  flex-shrink: 0;
  padding: 8px 12px;
  border-radius: 999px;
  background: var(--pink-light);
  color: var(--pink-dark);
  font-weight: 900;
}

#list {
  display: grid;
  gap: 14px;
}

.day {
  padding: 16px;
  border-radius: 22px;
}

.dayhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.date {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge {
  display: grid;
  place-content: center;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: linear-gradient(145deg, #ff8dac, #eb5a87);
  color: #ffffff;
  text-align: center;
  font-weight: 900;
  box-shadow: 0 7px 14px rgba(239, 102, 143, 0.25);
}

.badge b {
  font-size: 20px;
  line-height: 1;
}

.badge small {
  margin-top: 3px;
  font-size: 10px;
}

.date-title {
  font-size: 16px;
  font-weight: 900;
}

.weekday {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.today-label {
  padding: 6px 9px;
  border-radius: 999px;
  background: var(--pink-light);
  color: var(--pink-dark);
  font-size: 11px;
  font-weight: 900;
}

.events {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(200px, 1fr));
  gap: 9px;
}

.event {
  padding: 12px;
  border: 1px solid #eee0e5;
  border-radius: 15px;
  background: #fffdfd;
}

.event-title {
  margin-bottom: 9px;
  font-size: 13px;
  font-weight: 900;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 7px;
  border-radius: 50%;
  background: var(--event-color);
}

.names {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.name {
  padding: 7px 10px;
  border: 0;
  border-radius: 999px;
  background: var(--event-light);
  color: #645258;
  font-size: 12px;
  font-weight: 800;
}

.name.selected {
  outline: 2px solid var(--pink);
  outline-offset: 1px;
  background: var(--pink-light);
  color: var(--pink-dark);
}

.daily-character::after {
  content: "毎日";
  margin-left: 5px;
  padding: 2px 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.75);
  color: #59896b;
  font-size: 9px;
  font-weight: 900;
}

.empty {
  padding: 40px 20px;
  border: 1px dashed #e8ccd7;
  border-radius: 20px;
  background: #ffffff;
  color: #8c777c;
  text-align: center;
}

.empty-icon {
  margin-bottom: 7px;
  font-size: 36px;
}

/* ステータス */

.export-status {
  display: none;
  position: fixed;
  z-index: 11000;
  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom));
  max-width: calc(100vw - 36px);
  padding: 12px 16px;
  border-radius: 14px;
  background: #554846;
  color: #ffffff;
  box-shadow: 0 12px 30px rgba(57, 36, 42, 0.25);
  font-size: 13px;
  font-weight: 700;
}

.export-status.show {
  display: block;
}

.export-status.error {
  background: #bd3f5f;
}

footer {
  margin-top: 24px;
  color: #9b898d;
  font-size: 12px;
  text-align: center;
}

/* カレンダー画像生成専用 */

.calendar-export-host {
  position: absolute;
  z-index: 1;
  top: 0;
  left: -20000px;
  width: 1200px;
  background: #fff8fb;
  pointer-events: none;
}

.calendar-export-sheet {
  width: 1200px;
  padding: 34px;
  color: #554846;
  background: #fff8fb;

  font-family:
    "Yu Gothic",
    "Hiragino Maru Gothic ProN",
    "Noto Sans JP",
    sans-serif;
}

.calendar-export-header {
  margin-bottom: 18px;
  padding: 20px 24px;
  border: 1px solid #f0dce3;
  border-radius: 24px;
  background: #ffffff;
  text-align: center;
  box-shadow: 0 10px 28px rgba(139, 83, 96, 0.08);
}

.calendar-export-brand {
  margin: 0;
  color: #5b4943;
  font-family: Georgia, "Yu Mincho", serif;
  font-size: 42px;
  line-height: 1.1;
}

.calendar-export-subtitle {
  margin-top: 7px;
  color: #75615d;
  font-size: 14px;
  font-weight: 700;
}

.calendar-export-info {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 15px;
  padding: 14px 16px;
  border: 1px solid #f0dce3;
  border-radius: 17px;
  background: #ffffff;
}

.calendar-export-month {
  flex-shrink: 0;
  color: #5b4943;
  font-size: 28px;
  font-weight: 900;
}

.calendar-export-filter {
  max-width: 760px;
  color: #75615d;
  font-size: 12px;
  line-height: 1.7;
  text-align: right;
}

.calendar-weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.calendar-weekdays {
  margin-bottom: 6px;
}

.calendar-weekday {
  padding: 8px;
  color: #816d69;
  font-size: 13px;
  font-weight: 900;
  text-align: center;
}

.calendar-weekday.sunday {
  color: #dc5079;
}

.calendar-weekday.saturday {
  color: #598ab5;
}

.calendar-grid {
  overflow: hidden;
  border-top: 1px solid #ead6dd;
  border-left: 1px solid #ead6dd;
  border-radius: 18px;
  background: #ffffff;
}

.calendar-cell {
  position: relative;
  min-height: 164px;
  padding: 9px;
  overflow: hidden;
  border-right: 1px solid #ead6dd;
  border-bottom: 1px solid #ead6dd;
  background: #ffffff;
}

.calendar-cell.is-empty,
.calendar-cell.is-outside-range {
  background: #fbf8fa;
}

.calendar-day-number {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 25px;
  margin-bottom: 6px;
}

.calendar-day-number strong {
  display: grid;
  place-content: center;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  color: #554846;
  font-size: 14px;
}

.calendar-cell.sunday .calendar-day-number strong {
  color: #dc5079;
}

.calendar-cell.saturday .calendar-day-number strong {
  color: #598ab5;
}

.calendar-today-badge {
  padding: 3px 5px;
  border-radius: 999px;
  background: #fff0f5;
  color: #dc5079;
  font-size: 8px;
  font-weight: 900;
}

.calendar-items {
  display: grid;
  gap: 4px;
}

.calendar-item {
  padding: 5px 6px;
  overflow: hidden;
  border-left: 4px solid var(--calendar-color);
  border-radius: 7px;
  background: var(--calendar-light);
  color: #5e5050;
  font-size: 9px;
  font-weight: 700;
  line-height: 1.35;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.calendar-item-event {
  display: block;
  overflow: hidden;
  font-size: 9px;
  font-weight: 900;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.calendar-item-characters {
  display: block;
  margin-top: 1px;
  overflow: hidden;
  color: #705f60;
  font-size: 8px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.calendar-more {
  padding: 4px 5px;
  border-radius: 7px;
  background: #f7edf1;
  color: #80666e;
  font-size: 9px;
  font-weight: 900;
  text-align: center;
}

.calendar-legend {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.calendar-legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 8px;
  border: 1px solid #f0dfe5;
  border-radius: 999px;
  background: #ffffff;
  color: #766367;
  font-size: 9px;
  font-weight: 700;
}

.calendar-legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--legend-color);
}

.calendar-export-footer {
  margin-top: 15px;
  color: #9b898d;
  font-size: 10px;
  text-align: center;
}

@media (max-width: 850px) {
  .filter-grid {
    grid-template-columns: 1fr 1fr;
  }
}

/* スマートフォン */

@media (max-width: 600px) {
  main {
    padding:
      10px
      max(9px, env(safe-area-inset-left))
      calc(38px + env(safe-area-inset-bottom))
      max(9px, env(safe-area-inset-right));
  }

  header {
    padding: 20px 12px;
    border-radius: 22px;
  }

  .logo {
    gap: 8px;
  }

  .bow {
    width: 54px;
    height: 44px;
  }

  .bow-left,
  .bow-right {
    width: 28px;
    height: 28px;
  }

  .bow-center {
    top: 10px;
    width: 24px;
    height: 24px;
  }

  header p {
    font-size: 12px;
  }

  .header-description {
    font-size: 11px;
    line-height: 1.6;
  }

  .filters {
    padding: 14px 12px;

<main>
  <header>
    <div class="logo">

      <h1>
        Harmony

          <span>P</span><span>a</span><span>l</span><span>e</span><span>t</span><span>t</span><span>e</span>
        </span>
      </h1>
    </div>

    <p>
      ハーモニーランドの「楽しい！」がそろう場所
    </p>

    <div class="header-description">
      日付・イベント・複数のキャラクターから
      グリーティング予定を検索できます。
    </div>
  </header>

  <section class="filters" aria-label="検索条件">
    <div class="filter-grid">
      <div class="field character-field">
        <label
          class="field-label"
          for="characterToggle"
        >
          キャラクター
        </label>

        <button
          type="button"
          class="character-toggle"
          id="characterToggle"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="characterPopover"
        >
          <span id="characterSummary">
            すべてのキャラクター
          </span>
        </button>

        <div
          class="character-backdrop"
          id="characterBackdrop"
          aria-hidden="true"
        ></div>

        <section
          class="character-popover"
          id="characterPopover"
          role="dialog"
          aria-modal="true"
          aria-hidden="true"
          aria-labelledby="characterPopoverTitle"
        >
          <div class="character-popover-header">
            <h2
              class="character-popover-title"
              id="characterPopoverTitle"
            >
              キャラクターを選択
            </h2>

            <button
              type="button"
              class="character-close"
              id="characterClose"
              aria-label="キャラクター選択を閉じる"
            >
              ×
            </button>
          </div>

          <div class="character-tools">
            <button
              type="button"
              id="selectAllCharacters"
            >
              すべて選択
            </button>

            <button
              type="button"
              id="clearCharacters"
            >
              選択を解除
            </button>
          </div>

          <div class="character-scroll">
            <div
              id="characterChoices"
              class="character-choices"
            ></div>
          </div>

          <div class="character-popover-footer">
            <button
              type="button"
              class="character-apply"
              id="characterApply"
            >
              選択を反映して閉じる
            </button>
          </div>
        </section>
      </div>

      <div class="field">
        <label
          class="field-label"
          for="event"
        >
          イベント
        </label>

        <select id="event">
          <option value="">すべて</option>
          <option value="W">おでむかえグリーティング</option>
          <option value="B">ビンゴ</option>
          <option value="F">ファンスタジオ</option>
          <option value="H">はちゃめちゃグリーティング</option>
          <option value="T">ハイタッチグリーティング</option>
        </select>
      </div>

      <div class="field">
        <label
          class="field-label"
          for="from"
        >
          開始日
        </label>

        <input
          id="from"
          type="date"
          value="2026-07-22"
          min="2026-07-22"
          max="2026-09-15"
        >
      </div>

      <div class="field">
        <label
          class="field-label"
          for="to"
        >
          終了日
        </label>

        <input
          id="to"
          type="date"
          value="2026-09-15"
          min="2026-07-22"
          max="2026-09-15"
        >
      </div>
    </div>

    <div class="match-mode">
      <div class="match-mode-label">
        複数選択時の検索方法
      </div>

      <label class="match-radio">
        <input
          type="radio"
          name="matchMode"
          value="any"
          checked
        >
        いずれかに会える予定
      </label>

      <label class="match-radio">
        <input
          type="radio"
          name="matchMode"
          value="all"
        >
        全員に会える予定
      </label>
    </div>

    <div class="actions">
      <div class="chips">
        <button
          type="button"
          class="chip on"
          data-days="all"
        >
          全期間
        </button>

        <button
          type="button"
          class="chip"
          data-days="7"

          7日間
        </button>

          type="button"
          class="chip"
          data-days="14"

          14日間
        </button>

        </button>

        <button
          type="button"
          class="export-button"
          id="exportCalendarImage"
        >
          ▦ カレンダー画像を保存
        </button>

    <div class="information">

    <div

  </div>

  <div id="list"></div>

  <footer>

      day = "0" + day;
    }

    return year + "-" + month + "-" + day;
  }

  function slashDate(value) {
    return value.split("-").join("/");
  }

  function parseSchedule(source) {
    var result = [];
    var lines = source.split("\n");

    lines.forEach(function (originalLine) {
      var line = originalLine.trim();

      if (!line) {
        return;
      }

      var separatorPosition =
        line.indexOf("|");

      if (separatorPosition < 0) {
        return;
      }

      var date = line.slice(
        0,
        separatorPosition
      );

      var body = line.slice(
        separatorPosition + 1
      );

      body.split(";").forEach(
        function (part) {
          var equalPosition =
            part.indexOf("=");

          if (equalPosition < 0) {
            return;
          }

          var type = part.slice(
            0,
            equalPosition
          );

          var names = part
            .slice(equalPosition + 1)
            .split(",")
            .map(normalizeCharacterName)
            .filter(function (name) {
              return Boolean(name);
            });

          result.push({
            date: date,
            type: type,
            names: names
          });
        }
      );
    });

    return result;
  }

  function createDateRange(start, end) {
    var dates = [];
    var current = parseDate(start);
    var last = parseDate(end);

    while (current <= last) {
      dates.push(formatDate(current));

      current.setDate(
        current.getDate() + 1
      );
    }

    return dates;
  }

  var scheduleRows =
    parseSchedule(rawSchedule);

  createDateRange(
    scheduleStart,
    scheduleEnd
  ).forEach(function (date) {
    var fanStudio = null;

    scheduleRows.some(
      function (item) {
        if (
          item.date === date &&
          item.type === "F"
        ) {
          fanStudio = item;
          return true;
        }

        return false;
      }
    );

    if (!fanStudio) {
      fanStudio = {
        date: date,
        type: "F",
        names: []
      };

      scheduleRows.push(fanStudio);
    }

    dailyFanStudioCharacters.forEach(
      function (name) {
        if (
          fanStudio.names.indexOf(name) === -1
        ) {
          fanStudio.names.push(name);
        }
      }
    );
  });

  scheduleRows.sort(
    function (first, second) {
      if (first.date !== second.date) {
        return first.date.localeCompare(
          second.date
        );
      }

      return (
        eventMeta[first.type].order -
        eventMeta[second.type].order
      );
    }
  );

  var characterMap = {};

  scheduleRows.forEach(function (item) {
    item.names.forEach(function (name) {
      characterMap[name] = true;
    });
  });

  var characters = Object.keys(
    characterMap
  ).sort(function (first, second) {
    return first.localeCompare(
      second,
      "ja"
    );
  });

  characters.forEach(
    function (name, index) {
      var label =
        document.createElement("label");

      label.className =
        "character-check";

      var input =
        document.createElement("input");

      input.type = "checkbox";
      input.name = "character";
      input.value = name;
      input.id = "character-" + index;

      var text =
        document.createElement("span");

      text.textContent = name;

      label.appendChild(input);
      label.appendChild(text);

      characterChoices.appendChild(
        label
      );
    }
  );

  function getCharacterInputs() {
    return Array.prototype.slice.call(
      document.querySelectorAll(
        'input[name="character"]'
      )
    );
  }

  function getSelectedCharacters() {
    return getCharacterInputs()
      .filter(function (input) {
        return input.checked;
      })
      .map(function (input) {
        return input.value;
      });
  }

  function getMatchMode() {
    var selected =
      document.querySelector(
        'input[name="matchMode"]:checked'
      );

    return selected
      ? selected.value
      : "any";
  }

  function isMobile() {
    return window.innerWidth <= 600;
  }

  function openCharacterPopover(event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    if (
      characterPopover.classList.contains(
        "open"
      )
    ) {
      return;
    }

    lastCharacterFocus =
      document.activeElement;

    characterPopover.classList.add(
      "open"
    );

    characterPopover.setAttribute(
      "aria-hidden",
      "false"
    );

    characterToggle.setAttribute(
      "aria-expanded",
      "true"
    );

    if (isMobile()) {
      savedScrollPosition =
        window.pageYOffset ||
        document.documentElement.scrollTop ||
        0;

      document.body.style.top =
        "-" + savedScrollPosition + "px";

      document.body.classList.add(
        "modal-open"
      );

      characterBackdrop.classList.add(
        "open"
      );

      characterBackdrop.setAttribute(
        "aria-hidden",
        "false"
      );
    }

    window.setTimeout(function () {
      try {
        characterClose.focus();
      } catch (error) {
        /* フォーカスできない場合は無視 */
      }
    }, 50);
  }

  function closeCharacterPopover(
    restoreFocus
  ) {
    if (
      !characterPopover.classList.contains(
        "open"
      )
    ) {
      return;
    }

    characterPopover.classList.remove(
      "open"
    );

    characterPopover.setAttribute(
      "aria-hidden",
      "true"
    );

    characterBackdrop.classList.remove(
      "open"
    );

    characterBackdrop.setAttribute(
      "aria-hidden",
      "true"
    );

    characterToggle.setAttribute(
      "aria-expanded",
      "false"
    );

    if (
      document.body.classList.contains(
        "modal-open"
      )
    ) {
      document.body.classList.remove(
        "modal-open"
      );

      document.body.style.top = "";

      window.scrollTo(
        0,
        savedScrollPosition
      );
    }

    if (
      restoreFocus !== false &&
      lastCharacterFocus &&
      typeof lastCharacterFocus.focus ===
        "function"
    ) {
      window.setTimeout(function () {
        try {
          lastCharacterFocus.focus();
        } catch (error) {
          /* フォーカスできない場合は無視 */
        }
      }, 0);
    }
  }

  function matchesCharacters(
    schedule,
    selectedCharacters,
    matchMode
  ) {
    if (!selectedCharacters.length) {
      return true;
    }

    if (matchMode === "all") {
      return selectedCharacters.every(
        function (name) {
          return (
            schedule.names.indexOf(name) !==
            -1
          );
        }
      );
    }

    return selectedCharacters.some(
      function (name) {
        return (
          schedule.names.indexOf(name) !==
          -1
        );
      }
    );
  }

  function getFilteredRows() {
    var selectedCharacters =
      getSelectedCharacters();

    var matchMode =
      getMatchMode();

    return scheduleRows.filter(
      function (item) {
        var characterMatch =
          matchesCharacters(
            item,
            selectedCharacters,
            matchMode
          );

        var eventMatch =
          !eventSelect.value ||
          item.type === eventSelect.value;

        var dateMatch =
          item.date >= fromInput.value &&
          item.date <= toInput.value;

        return (
          characterMatch &&
          eventMatch &&
          dateMatch
        );
      }
    );
  }

  function updateCharacterControls() {
    var selected =
      getSelectedCharacters();

    getCharacterInputs().forEach(
      function (input) {
        var label =
          input.closest
            ? input.closest(
                ".character-check"
              )
            : input.parentNode;

        if (label) {
          if (input.checked) {
            label.classList.add(
              "selected-option"
            );
          } else {
            label.classList.remove(
              "selected-option"
            );
          }
        }
      }
    );

    if (!selected.length) {
      characterSummary.textContent =
        "すべてのキャラクター";
    } else if (selected.length === 1) {
      characterSummary.textContent =
        selected[0];
    } else if (selected.length <= 3) {
      characterSummary.textContent =
        selected.join("、");
    } else {
      characterSummary.textContent =
        selected.slice(0, 2).join("、") +
        " ほか" +
        (selected.length - 2) +
        "キャラクター";
    }
  }

  function render() {
    var filteredRows =
      getFilteredRows();

    var selectedCharacters =
      getSelectedCharacters();

    var grouped = {};

    filteredRows.forEach(function (item) {
      if (!grouped[item.date]) {
        grouped[item.date] = [];
      }

      grouped[item.date].push(item);
    });

    var dates = Object.keys(
      grouped
    ).sort();

    $("#count").textContent =
      filteredRows.length + "件";

    if (!selectedCharacters.length) {
      $("#heading").textContent =
        "スケジュール一覧";
    } else if (
      selectedCharacters.length === 1
    ) {
      $("#heading").textContent =
        selectedCharacters[0] +
        "の予定";
    } else {
      $("#heading").textContent =
        selectedCharacters.length +
        "キャラクターの予定";
    }

    $("#description").textContent =
      slashDate(fromInput.value) +
      "〜" +
      slashDate(toInput.value);

    updateCharacterControls();

    if (!dates.length) {
      list.innerHTML =
        '<div class="empty">' +
        '<div class="empty-icon">🎀</div>' +
        "<b>該当する予定がありません</b>" +
        "</div>";

      return;
    }

    var today =
      formatDate(new Date());

    list.innerHTML = dates.map(
      function (date) {
        var currentDate =
          parseDate(date);

        var month =
          currentDate.getMonth() + 1;

        var day =
          currentDate.getDate();

        var weekday =
          "日月火水木金土".charAt(
            currentDate.getDay()
          );

        var eventsHtml =
          grouped[date]
            .map(function (item) {
              var metadata =
                eventMeta[item.type];

              var namesHtml =
                item.names
                  .map(function (name) {
                    var selected =
                      selectedCharacters
                        .indexOf(name) !== -1;

                    var daily =
                      item.type === "F" &&
                      dailyFanStudioCharacters
                        .indexOf(name) !== -1;

                    return (
                      '<button type="button"' +
                      ' class="name' +
                      (selected
                        ? " selected"
                        : "") +
                      (daily
                        ? " daily-character"
                        : "") +
                      '"' +
                      ' style="--event-light:' +
                      metadata.light +
                      '"' +
                      ' data-name="' +
                      escapeHtml(name) +
                      '">' +
                      escapeHtml(name) +
                      "</button>"
                    );
                  })
                  .join("");

              return (
                '<section class="event"' +
                ' style="--event-color:' +
                metadata.color +
                ";--event-light:" +
                metadata.light +
                '">' +
                '<div class="event-title">' +
                '<span class="dot"></span>' +
                escapeHtml(metadata.name) +
                "</div>" +
                '<div class="names">' +
                namesHtml +
                "</div>" +
                "</section>"
              );
            })
            .join("");

        return (
          '<article class="day">' +
          '<div class="dayhead">' +
          '<div class="date">' +
          '<div class="badge">' +
          "<b>" +
          day +
          "</b>" +
          "<small>" +
          month +
          "月</small>" +
          "</div>" +
          "<div>" +
          '<div class="date-title">' +
          month +
          "月" +
          day +
          "日</div>" +
          '<div class="weekday">' +
          weekday +
          "曜日</div>" +
          "</div>" +
          "</div>" +
          (date === today
            ? '<span class="today-label">TODAY</span>'
            : "") +
          "</div>" +
          '<div class="events">' +
          eventsHtml +
          "</div>" +
          "</article>"
        );
      }
    ).join("");

    Array.prototype.slice.call(
      document.querySelectorAll(
        "[data-name]"
      )
    ).forEach(function (button) {
      button.addEventListener(
        "click",
        function () {
          var name =
            button.getAttribute(
              "data-name"
            );

          var target = null;

          getCharacterInputs().some(
            function (input) {
              if (input.value === name) {
                target = input;
                return true;
              }

              return false;
            }
          );

          if (target) {
            target.checked =
              !target.checked;
          }

          render();
        }
      );
    });
  }

  var statusTimer = null;

  function showStatus(
    message,
    error
  ) {
    window.clearTimeout(
      statusTimer
    );

    exportStatus.textContent =
      message;

    exportStatus.classList.add(
      "show"
    );

    if (error) {
      exportStatus.classList.add(
        "error"
      );
    } else {
      exportStatus.classList.remove(
        "error"
      );
    }

    statusTimer =
      window.setTimeout(function () {
        exportStatus.classList.remove(
          "show"
        );

        exportStatus.classList.remove(
          "error"
        );
      }, 4500);
  }

  function getTargetMonths(
    startValue,
    endValue
  ) {
    var start =
      parseDate(
        startValue.slice(0, 7) +
        "-01"
      );

    var end =
      parseDate(
        endValue.slice(0, 7) +
        "-01"
      );

    var months = [];

    while (start <= end) {
      months.push({
        year: start.getFullYear(),
        month: start.getMonth() + 1
      });

      start.setMonth(
        start.getMonth() + 1
      );
    }

    return months;
  }

  function getCalendarCharacters(
    schedule
  ) {
    var selected =
      getSelectedCharacters();

    if (!selected.length) {
      return schedule.names;
    }

    return schedule.names.filter(
      function (name) {
        return (
          selected.indexOf(name) !== -1
        );
      }
    );
  }

  function createFilterText() {
    var selected =
      getSelectedCharacters();

    var characterText =
      selected.length
        ? selected.join("、")
        : "すべてのキャラクター";

    var eventText =
      eventSelect.value
        ? eventMeta[
            eventSelect.value
          ].name
        : "すべてのイベント";

    return (
      "キャラクター：" +
      characterText +
      "　／　イベント：" +
      eventText
    );
  }

  function createCalendarSheet(
    year,
    month,
    filteredRows
  ) {
    var host =
      document.createElement("div");

    host.className =
      "calendar-export-host";

    var sheet =
      document.createElement("div");

    sheet.className =
      "calendar-export-sheet";

    var monthText =
      String(month);

    if (monthText.length < 2) {
      monthText =
        "0" + monthText;
    }

    var monthKey =
      year + "-" + monthText;

    var grouped = {};

    filteredRows
      .filter(function (item) {
        return (
          item.date.indexOf(
            monthKey
          ) === 0
        );
      })
      .forEach(function (item) {
        if (!grouped[item.date]) {
          grouped[item.date] = [];
        }

        grouped[item.date].push(
          item
        );
      });

    var firstDay =
      new Date(
        year,
        month - 1,
        1
      );

    var numberOfDays =
      new Date(
        year,
        month,
        0
      ).getDate();

    var cells = [];

    var index;

    for (
      index = 0;
      index < firstDay.getDay();
      index += 1
    ) {
      cells.push(
        '<div class="calendar-cell is-empty"></div>'
      );
    }

    var today =
      formatDate(new Date());

    var day;

    for (
      day = 1;
      day <= numberOfDays;
      day += 1
    ) {
      var current =
        new Date(
          year,
          month - 1,
          day
        );

      var date =
        formatDate(current);

      var weekday =
        current.getDay();

      var insideRange =
        date >= fromInput.value &&
        date <= toInput.value;

      var dayRows =
        insideRange
          ? grouped[date] || []
          : [];

      var visibleRows =
        dayRows.slice(0, 4);

      var hiddenCount =
        Math.max(
          0,
          dayRows.length - 4
        );

      var itemHtml =
        visibleRows.map(
          function (item) {
            var metadata =
              eventMeta[item.type];

            var names =
              getCalendarCharacters(
                item
              );

            var nameText =
              names.length
                ? names.join("・")
                : "対象キャラクター";

            return (
              '<div class="calendar-item"' +
              ' style="--calendar-color:' +
              metadata.color +
              ";--calendar-light:" +
              metadata.light +
              '">' +
              '<span class="calendar-item-event">' +
              escapeHtml(
                metadata.shortName
              ) +
              "</span>" +
              '<span class="calendar-item-characters">' +
              escapeHtml(nameText) +
              "</span>" +
              "</div>"
            );
          }
        ).join("");

      var cellClasses = [
        "calendar-cell"
      ];

      if (weekday === 0) {
        cellClasses.push(
          "sunday"
        );
      }

      if (weekday === 6) {
        cellClasses.push(
          "saturday"
        );
      }

      if (!insideRange) {
        cellClasses.push(
          "is-outside-range"
        );
      }

      cells.push(
        '<div class="' +
        cellClasses.join(" ") +
        '">' +
        '<div class="calendar-day-number">' +
        "<strong>" +
        day +
        "</strong>" +
        (date === today
          ? '<span class="calendar-today-badge">TODAY</span>'
          : "") +
        "</div>" +
        '<div class="calendar-items">' +
        itemHtml +
        (hiddenCount
          ? '<div class="calendar-more">ほか' +
            hiddenCount +
            "件</div>"
          : "") +
        "</div>" +
        "</div>"
      );
    }

    while (
      cells.length % 7 !== 0
    ) {
      cells.push(
        '<div class="calendar-cell is-empty"></div>'
      );
    }

    var legendHtml =
      Object.keys(eventMeta)
        .filter(function (type) {
          return (
            !eventSelect.value ||
            eventSelect.value === type
          );
        })
        .map(function (type) {
          var metadata =
            eventMeta[type];

          return (
            '<div class="calendar-legend-item">' +
            '<span class="calendar-legend-dot"' +
            ' style="--legend-color:' +
            metadata.color +
            '"></span>' +
            escapeHtml(metadata.name) +
            "</div>"
          );
        })
        .join("");

    sheet.innerHTML =
      '<div class="calendar-export-header">' +
      '<h1 class="calendar-export-brand">' +
      "Harmony " +
      '<span style="color:#ef668f">P</span>' +
      '<span style="color:#f5a55c">a</span>' +
      '<span style="color:#f3c96e">l</span>' +
      '<span style="color:#79c898">e</span>' +
      '<span style="color:#72c9bd">t</span>' +
      '<span style="color:#77b9df">t</span>' +
      '<span style="color:#b795d4">e</span>' +
      "</h1>" +
      '<div class="calendar-export-subtitle">' +
      "グリーティングスケジュール" +
      "</div>" +
      "</div>" +

      '<div class="calendar-export-info">' +
      '<div class="calendar-export-month">' +
      year +
      "年" +
      month +
      "月</div>" +

      '<div class="calendar-export-filter">' +
      escapeHtml(
        createFilterText()
      ) +
      "<br>" +
      "対象期間：" +
      slashDate(fromInput.value) +
      "〜" +
      slashDate(toInput.value) +
      "</div>" +
      "</div>" +

      '<div class="calendar-weekdays">' +
      '<div class="calendar-weekday sunday">日</div>' +
      '<div class="calendar-weekday">月</div>' +
      '<div class="calendar-weekday">火</div>' +
      '<div class="calendar-weekday">水</div>' +
      '<div class="calendar-weekday">木</div>' +
      '<div class="calendar-weekday">金</div>' +
      '<div class="calendar-weekday saturday">土</div>' +
      "</div>" +

      '<div class="calendar-grid">' +
      cells.join("") +
      "</div>" +

      '<div class="calendar-legend">' +
      legendHtml +
      "</div>" +

      '<div class="calendar-export-footer">' +
      "Harmony Palette unofficial schedule viewer" +
      "</div>";

    host.appendChild(sheet);

    return {
      host: host,
      sheet: sheet
    };
  }

  function waitForLayout() {
    var fontPromise =
      document.fonts &&
      document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve();

    return fontPromise.then(
      function () {
        return new Promise(
          function (resolve) {
            window.requestAnimationFrame(
              function () {
                window.requestAnimationFrame(
                  resolve
                );
              }
            );
          }
        );
      }
    );
  }

  function canvasToBlob(canvas) {
    return new Promise(
      function (resolve, reject) {
        canvas.toBlob(
          function (blob) {
            if (blob) {
              resolve(blob);
            } else {
              reject(
                new Error(
                  "PNG画像を作成できませんでした。"
                )
              );
            }
          },
          "image/png"
        );
      }
    );
  }

  function downloadBlob(
    blob,
    fileName
  ) {
    var url =
      URL.createObjectURL(blob);

    var link =
      document.createElement("a");

    link.href = url;
    link.download = fileName;

    document.body.appendChild(link);
    link.click();
    link.parentNode.removeChild(link);

    window.setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 2000);
  }

  async function exportCalendarImages() {
    closeCharacterPopover(false);

    if (
      typeof html2canvas ===
      "undefined"
    ) {
      showStatus(
        "画像作成ライブラリを読み込めませんでした。インターネット接続を確認してください。",
        true
      );

      return;
    }

    if (
      fromInput.value >
      toInput.value
    ) {
      showStatus(
        "開始日は終了日以前にしてください。",
        true
      );

      return;
    }

    var targetMonths =
      getTargetMonths(
        fromInput.value,
        toInput.value
      );

    var filteredRows =
      getFilteredRows();

    exportButton.disabled = true;

    exportButton.textContent =
      "カレンダー画像を作成中…";

    var generatedImages = [];
    var activeHost = null;

    try {
      var index;

      for (
        index = 0;
        index < targetMonths.length;
        index += 1
      ) {
        var target =
          targetMonths[index];

        showStatus(
          target.year +
          "年" +
          target.month +
          "月を作成中（" +
          (index + 1) +
          "/" +
          targetMonths.length +
          "）"
        );

        var created =
          createCalendarSheet(
            target.year,
            target.month,
            filteredRows
          );

        activeHost =
          created.host;

        document.body.appendChild(
          created.host
        );

        await waitForLayout();

        var canvas =
          await html2canvas(
            created.sheet,
            {
              backgroundColor:
                "#fff8fb",

              scale: 1.5,
              logging: false,
              useCORS: false,
              allowTaint: false,
              width: 1200,

              height:
                created.sheet.scrollHeight,

              windowWidth: 1200,

              windowHeight:
                created.sheet.scrollHeight,

              scrollX: 0,
              scrollY: 0
            }
          );

        var blob =
          await canvasToBlob(
            canvas
          );

        var monthText =
          String(target.month);

        if (monthText.length < 2) {
          monthText =
            "0" + monthText;
        }

        generatedImages.push({
          blob: blob,

          name:
            "harmony-palette_" +
            target.year +
            "-" +
            monthText +
            ".png"
        });

        created.host.parentNode.removeChild(
          created.host
        );

        activeHost = null;
      }

      if (
        generatedImages.length === 1
      ) {
        downloadBlob(
          generatedImages[0].blob,
          generatedImages[0].name
        );

        showStatus(
          "カレンダー画像を保存しました。"
        );
      } else {
        if (
          typeof JSZip ===
          "undefined"
        ) {
          throw new Error(
            "ZIPライブラリを読み込めませんでした。"
          );
        }

        showStatus(
          "月別画像をZIPにまとめています。"
        );

        var zip =
          new JSZip();

        generatedImages.forEach(
          function (image) {
            zip.file(
              image.name,
              image.blob
            );
          }
        );

        var zipBlob =
          await zip.generateAsync({
            type: "blob"
          });

        downloadBlob(
          zipBlob,

          "harmony-palette_calendars_" +
          fromInput.value +
          "_" +
          toInput.value +
          ".zip"
        );

        showStatus(
          generatedImages.length +
          "か月分の画像をZIPで保存しました。"
        );
      }
    } catch (error) {
      console.error(
        "カレンダー画像作成エラー:",
        error
      );

      showStatus(
        "画像の作成に失敗しました。" +
        (
          error &&
          error.message
            ? error.message
            : ""
        ),
        true
      );
    } finally {
      if (
        activeHost &&
        activeHost.parentNode
      ) {
        activeHost.parentNode.removeChild(
          activeHost
        );
      }

      exportButton.disabled = false;

      exportButton.textContent =
        "▦ カレンダー画像を保存";
    }
  }

  /*
    iPhone Safariではtouchendを併用すると、
    ローカルHTMLでも確実に開きやすくなります。
  */

  var touchHandled = false;

  characterToggle.addEventListener(
    "touchend",
    function (event) {
      touchHandled = true;
      openCharacterPopover(event);

      window.setTimeout(function () {
        touchHandled = false;
      }, 500);
    },
    false
  );

  characterToggle.addEventListener(
    "click",
    function (event) {
      if (touchHandled) {
        event.preventDefault();
        return;
      }

      openCharacterPopover(event);
    },
    false
  );

  characterClose.addEventListener(
    "click",
    function () {
      closeCharacterPopover(true);
    }
  );

  characterApply.addEventListener(
    "click",
    function () {
      closeCharacterPopover(true);
    }
  );

  characterBackdrop.addEventListener(
    "touchend",
    function (event) {
      event.preventDefault();
      closeCharacterPopover(true);
    },
    false
  );

  characterBackdrop.addEventListener(
    "click",
    function () {
      closeCharacterPopover(true);
    }
  );

  document.addEventListener(
    "keydown",
    function (event) {
      if (
        event.key === "Escape" &&
        characterPopover.classList.contains(
          "open"
        )
      ) {
        event.preventDefault();
        closeCharacterPopover(true);
      }
    }
  );

  getCharacterInputs().forEach(
    function (input) {
      input.addEventListener(
        "change",
        render
      );
    }
  );

  Array.prototype.slice.call(
    document.querySelectorAll(
      'input[name="matchMode"]'
    )
  ).forEach(function (input) {
    input.addEventListener(
      "change",
      render
    );
  });

  $("#selectAllCharacters")
    .addEventListener(
      "click",
      function () {
        getCharacterInputs().forEach(
          function (input) {
            input.checked = true;
          }
        );

        render();
      }
    );

  $("#clearCharacters")
    .addEventListener(
      "click",
      function () {
        getCharacterInputs().forEach(
          function (input) {
            input.checked = false;
          }
        );

        render();
      }
    );

  [
    eventSelect,
    fromInput,
    toInput
  ].forEach(function (element) {
    element.addEventListener(
      "change",
      function () {
        Array.prototype.slice.call(
          document.querySelectorAll(
            ".chip"
          )
        ).forEach(function (chip) {
          chip.classList.remove("on");
        });

        render();
      }
    );
  });

  Array.prototype.slice.call(
    document.querySelectorAll(
      ".chip"
    )
  ).forEach(function (button) {
    button.addEventListener(
      "click",
      function () {
        Array.prototype.slice.call(
          document.querySelectorAll(
            ".chip"
          )
        ).forEach(function (item) {
          item.classList.remove("on");
        });

        button.classList.add("on");

        fromInput.value =
          scheduleStart;

        if (
          button.getAttribute(
            "data-days"
          ) === "all"
        ) {
          toInput.value =
            scheduleEnd;
        } else {
          var endDate =
            parseDate(
              scheduleStart
            );

          endDate.setDate(
            endDate.getDate() +
            Number(
              button.getAttribute(
                "data-days"
              )
            ) -
            1
          );

          var calculated =
            formatDate(endDate);

          toInput.value =
            calculated > scheduleEnd
              ? scheduleEnd
              : calculated;
        }

        render();
      }
    );
  });

  $("#reset").addEventListener(
    "click",
    function () {
      getCharacterInputs().forEach(
        function (input) {
          input.checked = false;
        }
      );

      var anyMode =
        document.querySelector(
          'input[name="matchMode"][value="any"]'
        );

      if (anyMode) {
        anyMode.checked = true;
      }

      eventSelect.value = "";
      fromInput.value =
        scheduleStart;
      toInput.value =
        scheduleEnd;

      closeCharacterPopover(false);

      Array.prototype.slice.call(
        document.querySelectorAll(
          ".chip"
        )
      ).forEach(function (item) {
        if (
          item.getAttribute(
            "data-days"
          ) === "all"
        ) {
          item.classList.add("on");
        } else {
          item.classList.remove("on");
        }
      });

      render();
    }
  );

  exportButton.addEventListener(
    "click",
    exportCalendarImages
  );

  document.addEventListener(
    "pointerdown",
    function (event) {
      if (isMobile()) {
        return;
      }

      if (
        !characterPopover.classList.contains(
          "open"
        )
      ) {
        return;
      }

      if (
        characterPopover.contains(
          event.target
        ) ||
        characterToggle.contains(
          event.target
        )
      ) {
        return;
      }

      closeCharacterPopover(false);
    }
  );

  window.addEventListener(
    "orientationchange",
    function () {
      if (
        characterPopover.classList.contains(
          "open"
        )
      ) {
        window.setTimeout(
          function () {
            closeCharacterPopover(false);
          },
          150
        );
      }
    }
  );

  render();
})();
</script>
</body>
</html>
